function picked(){ return GAMES.filter(g=>g.pick).length; }
const navItems = [["home","🏠","League"],["picks","🏈","Picks"],["standings","🏆","Standings"],["invite","✉️","Invite"]];
function navBar(on){ return navItems.map(([k,i,l])=>`<a href="#" class="${on===k?'on':''}" data-screen="${k}">${l}</a>`).join(""); }
function tabBar(on){ return navItems.map(([k,i,l])=>`<a href="#" class="${on===k?'on':''}" data-screen="${k}"><span class="ico">${i}</span>${l}</a>`).join(""); }
function shell(on, inner){ return `
  <div class="appbar"><div class="logo"><span class="b">P</span> Pick'em</div><nav>${navBar(on)}</nav><button class="gear" title="Commissioner tools">⚙</button></div>
  <div class="wrap">${inner}</div>
  <nav class="tabbar">${tabBar(on)}</nav>`; }

function errorScreen(on){ return shell(on, `<div class="state"><div class="emo">⏰</div><h2>This invite ran out</h2>

/* =========================== I — Streaks =========================== */
const I = {};
function mvMark(mv){ return mv>0?`<span class="mv up">▲${mv}</span>`:mv<0?`<span class="mv down">▼${-mv}</span>`:`<span class="mv flat">–</span>`; }

  <div class="I-motiv"><div class="flame">🔥</div>
    <div class="txt"><div class="a">3-week streak going!</div><div class="b">You're 2nd of 8 — just 2 points behind Sarah. Keep it rolling.</div></div>

/* ------------------------------- wiring ------------------------------- */
const R = { G, H, I };
const SCREENS = [["home","League Home"],["picks","Make Picks"],["standings","Standings"],["create","Create League"],["invite","Invite / Join"],["empty","Empty State"],["error","Error States"]];
const VARIANTS = [["G","Gameday","refined D · focused"],["H","Scoreboard","sports-app · competition"],["I","Streaks","motivational"]];
let curScreen = "picks", curVariant = "G";
const app = document.getElementById("app");
const vlabel = document.getElementById("vlabel");
const screenSeg = document.getElementById("screenSeg");
function buildScreenSeg(){ screenSeg.innerHTML = SCREENS.map(([k,l])=>`<button data-screen="${k}" aria-current="${curScreen===k}">${l}</button>`).join(""); }
function render(){
  app.dataset.variant = curVariant;
  const fn = R[curVariant][curScreen] || R[curVariant].home;
  app.innerHTML = fn();
  const v = VARIANTS.find(v=>v[0]===curVariant);
  vlabel.innerHTML = `${v[0]} — ${v[1]} <span>· ${v[2]}</span>`;
  buildScreenSeg();
  const url = new URL(location); url.searchParams.set("variant",curVariant); url.searchParams.set("screen",curScreen); history.replaceState(null,"",url);
}
function setScreen(s){ curScreen=s; render(); window.scrollTo(0,0); }
function cycleVariant(d){ const i=VARIANTS.findIndex(v=>v[0]===curVariant); curVariant=VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0]; render(); }
document.addEventListener("click",(e)=>{
  const scr = e.target.closest("[data-screen]"); if (scr){ e.preventDefault(); setScreen(scr.dataset.screen); return; }
  const pick = e.target.closest("[data-pick]"); if (pick){ const g=GAMES.find(x=>x.id==pick.dataset.pick); g.pick=(g.pick===pick.dataset.team)?null:pick.dataset.team; render(); }
});
document.addEventListener("input",(e)=>{ if (e.target.matches("[data-mnf]")) mnfGuess=e.target.value; });
document.getElementById("prevV").onclick=()=>cycleVariant(-1);
document.getElementById("nextV").onclick=()=>cycleVariant(1);
document.addEventListener("keydown",(e)=>{ const t=e.target.tagName; if (t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return; if (e.key==="ArrowLeft") cycleVariant(-1); if (e.key==="ArrowRight") cycleVariant(1); });
document.getElementById("themeToggle").onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme"); const next = cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"); document.documentElement.setAttribute("data-theme", next); };
const p = new URL(location).searchParams;
if (p.get("variant") && R[p.get("variant")]) curVariant=p.get("variant");
if (p.get("screen") && SCREENS.some(s=>s[0]===p.get("screen"))) curScreen=p.get("screen");
render();
</script>
